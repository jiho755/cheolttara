name: Update events

on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC = 03:00 KST
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: festivals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch festivals from TourAPI
        id: festivals
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python3 scripts/fetch_festivals.py

      - name: Fetch culture events from Seoul Open Data
        id: culture
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python3 scripts/fetch_culture_seoul.py

      - name: Fetch culture events (nationwide)
        id: culture_kr
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python3 scripts/fetch_culture_kr.py

      - name: Commit and push if changed
        run: |
          FILES="data/festivals.json data/culture_seoul.json data/culture_kr.json"
          if git diff --quiet -- $FILES; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: update events data"
          git push

      # 커밋이 끝난 뒤에 실패를 표시해서 Actions 탭에서 알아챌 수 있게 한다
      - name: Fail if any fetch step failed
        if: steps.festivals.outcome == 'failure' || steps.culture.outcome == 'failure' || steps.culture_kr.outcome == 'failure'
        run: |
          echo "festivals: ${{ steps.festivals.outcome }}, culture: ${{ steps.culture.outcome }}, culture_kr: ${{ steps.culture_kr.outcome }}"
          exit 1
